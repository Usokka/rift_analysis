name: Portfolio demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Generate verified match catalogs
        run: |
          uv run python scripts/download_data.py --years 2023 2025 --output-dir data/raw
          uv run python scripts/build_portfolio_demo.py \
            data/raw/2023_LoL_esports_match_data_from_OraclesElixir.csv \
            data/raw/2025_LoL_esports_match_data_from_OraclesElixir.csv
      - run: npm --prefix apps/web ci
      - name: Build verified static demo
        env:
          VITE_DEMO_MODE: "true"
        run: npm --prefix apps/web run build -- --base=/rift_analysis/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
