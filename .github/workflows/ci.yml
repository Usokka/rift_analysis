name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rift_test
          POSTGRES_USER: rift
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rift -d rift_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://rift:test_only@localhost:5432/rift_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make install
      - run: make check
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - name: Verify migrations and repeated upgrade
        run: |
          docker compose run --rm migrate
          docker compose run --rm migrate .venv/bin/alembic check
          docker compose exec -T postgres psql -U rift -d rift_analyst -tAc "SELECT version_num FROM public.alembic_version" | grep -qx 0001
      - name: Smoke test API and web proxy
        run: |
          curl --fail --retry 3 http://localhost:8000/api/v1/ready
          curl --fail --retry 3 http://localhost:3000/api/v1/ready
          curl --fail http://localhost:3000/ | grep -q 'Rift Analyst'
      - name: Verify proxy recovery after API recreation
        run: |
          docker compose up -d --no-deps --force-recreate --wait api
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:3000/api/v1/ready
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
